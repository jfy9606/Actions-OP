#
# AN7581 multi-board build matrix: w1700k (regression) +F xg2010g + nokia-xg-040g-md.
# Verifies fsdata selection per board and that w1700k regression is not broken.
#
name: AN7581 Multi-Board Build

on:
  repository_dispatch:
    types: [an7581-multi-board]
  workflow_dispatch:
    inputs:
      MODEL:
        description: 'Model selection (w1700k, xg2010g, nokia, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - w1700k
          - xg2010g
          - nokia
      REPO_URL:
        description: 'Source repository'
        required: true
        default: 'https://github.com/jfy9606/uboot-op'
        type: string
      REPO_BRANCH:
        description: 'Repository branch'
        required: true
        default: 'main'
        type: string

env:
  TZ: Asia/Shanghai
  REPO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.REPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: w1700k
            defconfig: w1700k_defconfig
            expected_fsdata: fsdata_w1700k.c
            regression: true
          - model: xg2010g
            defconfig: xg2010g_defconfig
            expected_fsdata: fsdata_xg2010g.c
            regression: false
          - model: nokia
            defconfig: an7581_nokia-xg-040g-md_defconfig
            expected_fsdata: fsdata_xg2010g.c
            regression: false

    permissions:
      contents: write

    steps:
    - name: Space cleanup and Initialization environment
      env:
         DEBIAN_FRONTEND: noninteractive
      run: |
         sudo -E rm -rf /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android /usr/local/lib/node_modules
         sudo -E apt-mark hold grub-efi-amd64-signed $(dpkg --list | grep '^ii  linux-image' | awk '{print $2}')
         sudo -E apt -qq update
         sudo -E apt -qq -y purge azure-cli* '^llvm-.*' docker* google* powershell* snap*
         sudo -E apt -qq -y full-upgrade
         sudo -E apt -qq install -y build-essential gcc-aarch64-linux-gnu ccache device-tree-compiler bc bison flex libssl-dev python3 python-is-python3 python3-dev python3-pyelftools python3-setuptools swig pkg-config tar
         sudo -E apt -qq -y autoremove --purge
         sudo -E apt -qq autoclean

    - name: Checkout source
      if: (github.event.inputs.MODEL || 'all') == 'all' || (github.event.inputs.MODEL || 'all') == matrix.model
      run: |
        set -euo pipefail
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        cd /workdir
        df -hT "$PWD"

        REPO_URL_IN="${{ inputs.REPO_URL }}"
        REPO_BRANCH_IN="${{ inputs.REPO_BRANCH }}"

        if [ -n "$REPO_TOKEN" ]; then
          REPO_URL_IN="$(echo "$REPO_URL_IN" | sed "s|https://|https://${REPO_TOKEN}@|")"
        fi

        echo "Using source: ${{ inputs.REPO_URL }} (ref: $REPO_BRANCH_IN)"
        git clone --depth 1 --branch "$REPO_BRANCH_IN" "$REPO_URL_IN" uboot-op

        SOURCE_SHA="$(git -C uboot-op rev-parse HEAD)"
        echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
        echo "REPO_BRANCH=$REPO_BRANCH_IN" >> "$GITHUB_ENV"
        ln -sf /workdir/uboot-op "$GITHUB_WORKSPACE/uboot-op"

    - name: Enable ccache
      run: |
        mkdir -p $HOME/.ccache/bin
        ln -sf $(which ccache) $HOME/.ccache/bin/aarch64-linux-gnu-gcc
        ln -sf $(which ccache) $HOME/.ccache/bin/aarch64-linux-gnu-g++
        echo "PATH=$HOME/.ccache/bin:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-an7581-multi-${{ matrix.model }}-${{ github.sha }}
        restore-keys: |
          ccache-an7581-multi-${{ matrix.model }}-

    - name: Build U-Boot for ${{ matrix.model }}
      id: compile
      if: (github.event.inputs.MODEL || 'all') == 'all' || (github.event.inputs.MODEL || 'all') == matrix.model
      run: |
        set -euo pipefail
        cd uboot-op
        echo "=== Building ${{ matrix.model }} (${{ matrix.defconfig }}) ==="
        export ARCH=arm
        export CROSS_COMPILE="ccache aarch64-linux-gnu-"
        make ${{ matrix.defconfig }}
        make -j"$(nproc)"

        BUILD_TARGET="$(grep -E '^CONFIG_BUILD_TARGET=' .config | cut -d'"' -f2)"
        if [ -z "$BUILD_TARGET" ]; then
          BUILD_TARGET="u-boot.bin"
        fi
        echo "Build target: $BUILD_TARGET"
        [ -f "$BUILD_TARGET" ] || { echo "Error: $BUILD_TARGET not found"; exit 1; }
        [ -f "u-boot.bin" ] || { echo "Error: u-boot.bin not found"; exit 1; }
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Verify fsdata selection for ${{ matrix.model }}
      if: steps.compile.outputs.status == 'success'
      run: |
        cd uboot-op
        echo "=== fsdata selection check for ${{ matrix.model }} ==="
        grep "HTTPD_FSDATA_FILE" lib/lwip/Makefile
        ACTUAL="$(grep -oE 'fsdata_[a-z0-9]+\.c' lib/lwip/Makefile | sort -u | tr '\n' ' ')"
        echo "Available fsdata files in Makefile: $ACTUAL"
        echo "Expected for ${{ matrix.model }}: ${{ matrix.expected_fsdata }}"
        DEVICE_TREE="$(grep -E '^CONFIG_DEFAULT_DEVICE_TREE=' .config | cut -d'"' -f2)"
        echo "CONFIG_DEFAULT_DEVICE_TREE=$DEVICE_TREE"
        echo "Expected fsdata: ${{ matrix.expected_fsdata }}"

    - name: w1700k regression gate
      if: steps.compile.outputs.status == 'success' && matrix.regression == true
      run: |
        cd uboot-op
        echo "=== w1700k regression verification ==="
        grep -q "CONFIG_CMD_TELNETD=y" .config || { echo "Error: w1700k CONFIG_CMD_TELNETD missing"; exit 1; }
        [ -f "lib/lwip/httpd/fsdata_w1700k.c" ] || { echo "Error: fsdata_w1700k.c missing"; exit 1; }
        [ -f "net/lwip/recovery_telnetd.c" ] || { echo "Error: recovery_telnetd.c missing"; exit 1; }
        echo "w1700k regression PASSED: telnetd + fsdata_w1700k + recovery_telnetd all retained"

    - name: Upload artifact
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: an7581_multi_${{ matrix.model }}
        path: uboot-op/u-boot.bin
