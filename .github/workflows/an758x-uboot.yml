# Adapted from hurrian/w1700k-ubi-installer build-17xx.yaml (dual-board matrix)
# and mt798x-uboot.yml (artifact/release style). Uses direct defconfig+make path
# (no OpenWrt build system dependency).
#
# Extended for AN7581 + AN7583 multi-board builds with FIP auto-merge:
#   - w1700k / xr1710g / xg2010g / nokia-xg-040g-md  (AN7581 SoC)
#   - xg040mf                                        (AN7583 SoC)
# Boards requiring chainloader packaging (w1700k, xr1710g) use
# chainloader/build-uboot-image.sh; other boards ship u-boot.bin / u-boot.img
# directly as the release artifact.
# Boards needing FIP (xg040mf, nokia-xg-040g-md) get BL31+U-Boot merged
# via scripts/bl31-fetch.sh + scripts/fip-merge.sh (LZMA + fiptool create).
#
name: an758x-uboot

on:
  repository_dispatch:
    types: [an758x-uboot]
  workflow_dispatch:
    inputs:
      MODEL:
        description: 'Model selection (w1700k, xr1710g, xg2010g, nokia-xg-040g-md, xg040mf, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - w1700k
          - xr1710g
          - xg2010g
          - nokia-xg-040g-md
          - xg040mf
      REPO_URL:
        description: 'Source repository'
        required: true
        default: 'https://github.com/jfy9606/uboot-op'
        type: string
      REPO_BRANCH:
        description: 'Repository branch (main contains the unified U-Boot source tree)'
        required: true
        default: 'main'
        type: string
      pub_release:
        description: 'Publish to GitHub Release'
        required: false
        default: 'true'
        type: boolean


env:
  TZ: Asia/Shanghai
  REPO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.REPO_TOKEN }}
  UPLOAD_RELEASE: ${{ github.event.inputs.pub_release != 'false' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          # --- AN7581 SoC boards ---
          - model: xr1710g
            defconfig: xr1710g_defconfig
            artifact_name: xr1710g-chainloader-slot.bin
            needs_slot: true
            needs_chainloader: true
            needs_fip: false
            regression: false
          - model: w1700k
            defconfig: w1700k_defconfig
            artifact_name: u-boot-w1700k.itb
            needs_slot: false
            needs_chainloader: true
            needs_fip: false
            regression: true
            expected_fsdata: fsdata_w1700k.c
          - model: xg2010g
            defconfig: xg2010g_defconfig
            artifact_name: u-boot-xg2010g.img
            needs_slot: false
            needs_chainloader: false
            needs_fip: false
            regression: false
            expected_fsdata: fsdata_xg2010g.c
          - model: nokia-xg-040g-md
            defconfig: an7581_nokia-xg-040g-md_defconfig
            artifact_name: u-boot-nokia-xg-040g-md.bin
            needs_slot: false
            needs_chainloader: false
            needs_fip: true
            regression: false
            expected_fsdata: fsdata_xg2010g.c
          # --- AN7583 SoC boards ---
          - model: xg040mf
            defconfig: an7583_nokia_xg-040g-mf_defconfig
            artifact_name: u-boot-xg040mf.bin
            needs_slot: false
            needs_chainloader: false
            needs_fip: true
            regression: false
            expected_fsdata: fsdata_xg2010g.c

    permissions:
      contents: write

    steps:
    - name: Check Server Performance
      run: |
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT


    - name: Space cleanup and Initialization environment
      env:
         DEBIAN_FRONTEND: noninteractive
      run: |
         sudo -E rm -rf /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android /usr/local/lib/node_modules
         sudo -E apt-mark hold grub-efi-amd64-signed $(dpkg --list | grep '^ii  linux-image' | awk '{print $2}')
         sudo -E apt -qq update
         sudo -E apt -qq -y purge azure-cli* '^llvm-.*' docker* google* powershell* snap*
         sudo -E apt -qq -y full-upgrade
         sudo -E apt -qq install -y build-essential gcc-aarch64-linux-gnu ccache device-tree-compiler bc bison flex libssl-dev python3 python-is-python3 python3-dev python3-pyelftools python3-setuptools swig pkg-config tar rename xz-utils
         sudo -E systemctl daemon-reload
         sudo -E apt -qq -y autoremove --purge
         sudo -E apt -qq autoclean
         sudo -E timedatectl set-timezone "Asia/Shanghai"

    - name: Checkout source
      if: (github.event.inputs.MODEL || 'all') == 'all' || (github.event.inputs.MODEL || 'all') == matrix.model
      run: |
        set -euo pipefail
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir
        cd /workdir
        df -hT "$PWD"

        REPO_URL_IN="${{ inputs.REPO_URL }}"
        REPO_BRANCH_IN="${{ inputs.REPO_BRANCH }}"

        if [ -n "$REPO_TOKEN" ]; then
          REPO_URL_IN="$(echo "$REPO_URL_IN" | sed "s|https://|https://${REPO_TOKEN}@|")"
        fi

        echo "Using source: ${{ inputs.REPO_URL }} (ref: $REPO_BRANCH_IN)"
        git clone --depth 1 --branch "$REPO_BRANCH_IN" "$REPO_URL_IN" uboot-op

        SOURCE_SHA="$(git -C uboot-op rev-parse HEAD)"
        echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
        echo "REPO_BRANCH=$REPO_BRANCH_IN" >> "$GITHUB_ENV"
        ln -sf /workdir/uboot-op "$GITHUB_WORKSPACE/uboot-op"


    - name: Enable ccache
      run: |
        mkdir -p $HOME/.ccache/bin
        ln -sf $(which ccache) $HOME/.ccache/bin/aarch64-linux-gnu-gcc
        ln -sf $(which ccache) $HOME/.ccache/bin/aarch64-linux-gnu-g++
        echo "PATH=$HOME/.ccache/bin:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-an758x-${{ matrix.model }}-${{ github.sha }}
        restore-keys: |
          ccache-an758x-${{ matrix.model }}-

    - name: Build U-Boot for ${{ matrix.model }}
      id: compile
      if: (github.event.inputs.MODEL || 'all') == 'all' || (github.event.inputs.MODEL || 'all') == matrix.model
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/output"
        cd uboot-op

        echo "=== Building ${{ matrix.model }} (${{ matrix.defconfig }}) ==="
        export ARCH=arm
        export CROSS_COMPILE="ccache aarch64-linux-gnu-"
        make ${{ matrix.defconfig }}
        make -j"$(nproc)"

        BUILD_TARGET="$(grep -E '^CONFIG_BUILD_TARGET=' .config | cut -d'"' -f2)"
        if [ -z "$BUILD_TARGET" ]; then
          BUILD_TARGET="u-boot.bin"
        fi
        echo "Build target: $BUILD_TARGET"

        if [ ! -f "$BUILD_TARGET" ]; then
          echo "Error: $BUILD_TARGET not found after build" >&2
          ls -la u-boot* 2>/dev/null || true
          exit 1
        fi

        if [ ! -f "u-boot.bin" ]; then
          echo "Error: u-boot.bin not found after build" >&2
          exit 1
        fi

        if [ "${{ matrix.needs_chainloader }}" = "true" ]; then
          echo "=== Building ${{ matrix.model }} image via chainloader script ==="
          if [ "${{ matrix.needs_slot }}" = "false" ]; then
            if [ ! -f "u-boot.dtb" ]; then
              echo "Error: u-boot.dtb not found after build" >&2
              exit 1
            fi
            ./chainloader/build-uboot-image.sh \
              "${{ matrix.model }}" \
              "u-boot.bin" \
              "u-boot.dtb" \
              "$GITHUB_WORKSPACE/output/${{ matrix.artifact_name }}"
          else
            ./chainloader/build-uboot-image.sh \
              "${{ matrix.model }}" \
              "u-boot.bin" \
              "$GITHUB_WORKSPACE/output/${{ matrix.artifact_name }}"
          fi
        else
          echo "=== Copying $BUILD_TARGET directly (no chainloader needed) ==="
          cp "$BUILD_TARGET" "$GITHUB_WORKSPACE/output/${{ matrix.artifact_name }}"
        fi

        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Verify fsdata selection for ${{ matrix.model }}
      if: steps.compile.outputs.status == 'success' && matrix.expected_fsdata && !cancelled()
      continue-on-error: true
      run: |
        cd uboot-op
        EXPECTED="${{ matrix.expected_fsdata }}"
        ACTUAL=$(grep -oP 'HTTPD_FSDATA_FILE\s*[:=]\s*\K.*' lib/lwip/Makefile 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
        if [ -n "$ACTUAL" ]; then
          echo "fsdata: expected=$EXPECTED actual=$ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || echo "Warning: fsdata mismatch for ${{ matrix.model }}"
        fi
        [ -f "lib/lwip/httpd/$EXPECTED" ] && echo "fsdata file $EXPECTED exists" || echo "Warning: $EXPECTED not found"

    - name: w1700k regression gate
      if: steps.compile.outputs.status == 'success' && matrix.regression == true && !cancelled()
      run: |
        cd uboot-op
        echo "=== w1700k regression gate ==="
        grep -q "CONFIG_CMD_TELNETD=y" .config || { echo "FAIL: CONFIG_CMD_TELNETD=y missing"; exit 1; }
        [ -f lib/lwip/httpd/fsdata_w1700k.c ] || { echo "FAIL: fsdata_w1700k.c missing"; exit 1; }
        [ -f net/lwip/recovery_telnetd.c ] || { echo "FAIL: recovery_telnetd.c missing"; exit 1; }
        grep -q "CONFIG_PCS_AIROHA_AN7581=y" .config || { echo "FAIL: CONFIG_PCS_AIROHA_AN7581=y missing"; exit 1; }
        echo "w1700k regression gate: PASS"


    - name: FIP merge for ${{ matrix.model }}
      id: fip
      if: steps.compile.outputs.status == 'success' && matrix.needs_fip == true && !cancelled()
      continue-on-error: true
      run: |
        set -euo pipefail
        cd uboot-op

        echo "=== Installing fiptool ==="
        # Build fiptool from TF-A source (lightweight, no full TF-A build needed)
        sudo apt -qq install -y python3 python3-pyelftools
        FIP_TMP="$(mktemp -d)"
        git clone --depth 1 --branch v2.10 https://git.trustedfirmware.org/TF-A/trusted-firmware-a.git "$FIP_TMP/tfa"
        make -C "$FIP_TMP/tfa" V=0 fiptool
        sudo cp "$FIP_TMP/tfa/tools/fiptool/fiptool" /usr/local/bin/fiptool
        rm -rf "$FIP_TMP"

        echo "=== Fetching BL31 for ${{ matrix.model }} ==="
        BL31_OUT="/tmp/bl31-${{ matrix.model }}.bin"
        BL31_SOURCE="$(scripts/bl31-fetch.sh "${{ matrix.model }}" "$BL31_OUT" 2>&1)" || true
        echo "BL31 source: $BL31_SOURCE"

        if [ ! -s "$BL31_OUT" ]; then
          echo "Warning: BL31 acquisition failed for ${{ matrix.model }}, skipping FIP merge"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "=== Merging FIP (BL31 + U-Boot) ==="
        UBOOT_BIN="$GITHUB_WORKSPACE/output/${{ matrix.artifact_name }}"
        FIP_OUT="$GITHUB_WORKSPACE/output/${{ matrix.model }}-bl31-uboot.fip"
        scripts/fip-merge.sh "$BL31_OUT" "$UBOOT_BIN" "$FIP_OUT"
        echo "FIP created: $FIP_OUT ($(wc -c < "$FIP_OUT") bytes)"
        echo "status=success" >> "$GITHUB_OUTPUT"


    - name: Generate release notes
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        touch release.txt
        echo "- Commit: ${{ env.SOURCE_SHA }}" >> release.txt
        echo "- Model: ${{ matrix.model }}" >> release.txt
        echo "- Defconfig: ${{ matrix.defconfig }}" >> release.txt
        echo "- Source: ${{ inputs.REPO_URL }} (branch: ${{ env.REPO_BRANCH }})" >> release.txt
        echo "- Build time: ${{ env.FILE_DATE }}" >> release.txt
        if [ "${{ steps.fip.outputs.status }}" = "success" ]; then
          echo "- FIP: ${{ matrix.model }}-bl31-uboot.fip (BL31 + U-Boot merged)" >> release.txt
        fi
        echo "" >> release.txt
        echo "---" >> release.txt
        echo "" >> release.txt
        echo "**AN758x SoC multi-board U-Boot build (W1700K / XR1710G / XG2010G / Nokia-XG-040G-MD / XG-040G-MF).**" >> release.txt
        echo "release_tag=${{ env.FILE_DATE }}-an758x-${{ matrix.model }}" >> "$GITHUB_OUTPUT"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Publish to Private Repo Release
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.REPO_TOKEN }}
        RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
      run: |
        set -euo pipefail
        RELEASE_REPO="${RELEASE_REPO:-jfy9606/uboot-op}"
        if [ -z "$GH_TOKEN" ]; then
          echo "REPO_TOKEN secret not set, skipping publish"
          exit 0
        fi
        TAG="${{ steps.tag.outputs.release_tag }}"
        TITLE="${{ env.FILE_DATE }}-an758x-${{ matrix.model }}"
        echo "Publishing to $RELEASE_REPO release $TAG"
        gh release create "$TAG" \
          --repo "$RELEASE_REPO" \
          --title "$TITLE" \
          --notes-file release.txt \
          output/*
